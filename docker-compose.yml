services:
  bot:
    build: .
    container_name: fast_media_bot
    restart: always
    env_file:
      - config.env
    volumes:
      - ./sessions:/app/sessions
      - ./downloads:/app/downloads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep bot.py || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
